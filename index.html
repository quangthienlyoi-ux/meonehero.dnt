<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>UTMT Web</title>
<style>
    body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;background:#1a1a1a;color:#eee}
    h1{color:#7ec8ff}
    #dropZone{border:2px dashed #444;padding:2rem;text-align:center;border-radius:12px;cursor:pointer;margin-bottom:1rem;transition:.2s}
    #dropZone.hover{border-color:#7ec8ff;background:#252525}
    #dropZone input{display:none}
    #fileInfo,#counts{background:#252525;padding:1rem;border-radius:8px;margin:1rem 0}
    #chunkList{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0;max-height:180px;overflow-y:auto}
    .chunk-item{background:#2a2a2a;padding:.3rem .6rem;border-radius:4px;font-size:.85em}
    .actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
    button{background:#2d5f8a;color:#fff;border:none;padding:.6rem 1rem;border-radius:6px;cursor:pointer}
    button:hover{background:#3d7fb0}
    button.primary{background:#4a9d4a}button.primary:hover{background:#5cba5c}
    #log{background:#111;padding:1rem;border-radius:8px;font-family:monospace;font-size:.85em;height:200px;overflow-y:auto}
    .log-info{color:#aaa}.log-ok{color:#7ed77e}.log-warn{color:#e8c45c}.log-err{color:#ff6b6b}
</style>
</head>
<body>
    <h1>UTMT Web</h1>
    <p>Đọc file <code>data.win</code>/<code>game.droid</code>, giải mã sprite, âm thanh, strings, code.</p>

    <label id="dropZone">
        <input type="file" id="fileInput" accept=".win,.droid">
        <div>📁 Kéo thả file vào đây hoặc bấm để chọn</div>
    </label>

    <div id="fileInfo">Chưa có file</div>
    <div id="counts"></div>
    <div id="chunkList"></div>

    <div class="actions">
        <button id="btnSprites">⬇ Tải sprite (PNG)</button>
        <button id="btnAudio">⬇ Tải audio</button>
        <button id="btnStrings">⬇ Tải strings</button>
        <button id="btnCode">⬇ Tải code strings</button>
    </div>
    <div class="actions">
        <button id="btnZipSprites" class="primary">🗜 ZIP Sprites</button>
        <button id="btnZipAudio" class="primary">🗜 ZIP Audio</button>
        <button id="btnZipAll" class="primary">🗜 ZIP Tất cả</button>
    </div>

    <div id="log"></div>
    <script src="app.js"></script>
</body>
</html>
