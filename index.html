<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>UTMT Web — Undertale Mod Tool</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root[data-theme="dark"]{
    --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#252525; --surface3:#2f2f2f;
    --border:#333; --text:#eee; --text-dim:#999;
    --accent:#7ec8ff; --accent-bg:#1e3a4f;
    --ok:#7ed77e; --warn:#e8c45c; --danger:#ff6b6b;
    --shadow:0 4px 12px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
    --bg:#f5f6f8; --surface:#fff; --surface2:#f0f2f5; --surface3:#e4e6ea;
    --border:#d8dde3; --text:#1a1f26; --text-dim:#5f6875;
    --accent:#2196f3; --accent-bg:#e3f2fd;
    --ok:#2e7d32; --warn:#f57c00; --danger:#c62828;
    --shadow:0 4px 12px rgba(0,0,0,.08);
}

html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
    transition:background .2s,color .2s}

/* HEADER */
.app-header{position:sticky;top:0;z-index:100;background:var(--surface);
    border-bottom:1px solid var(--border);padding:.75rem 1rem;
    display:flex;justify-content:space-between;align-items:center;
    backdrop-filter:blur(8px)}
.brand{display:flex;align-items:baseline;gap:.5rem}
.brand h1{font-size:1.1rem;color:var(--accent);font-weight:700}
.version{font-size:.75rem;color:var(--text-dim);background:var(--surface2);
    padding:.15rem .5rem;border-radius:4px}
.btn-icon{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;width:36px;height:36px;display:inline-flex;
    align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem}
.btn-icon:hover{background:var(--surface3)}

/* MAIN */
.app-main{max-width:1200px;margin:0 auto;padding:1rem;padding-bottom:100px}

/* DROP ZONE */
.drop-zone{display:block;border:2px dashed var(--border);border-radius:16px;
    padding:2rem 1rem;text-align:center;cursor:pointer;
    transition:all .2s;background:var(--surface);margin-bottom:1rem}
.drop-zone:hover,.drop-zone.hover{border-color:var(--accent);background:var(--accent-bg)}
.drop-zone input{display:none}
.drop-icon{font-size:3rem;margin-bottom:.5rem}
.drop-title{font-size:1rem;margin-bottom:.25rem}
.drop-hint{color:var(--text-dim);font-size:.9rem}

/* PROGRESS */
.progress{display:none;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:1rem;margin-bottom:1rem}
.progress.active{display:block}
.progress-info{display:flex;justify-content:space-between;
    margin-bottom:.5rem;font-size:.9rem;color:var(--text-dim)}
.progress-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));
    width:0%;transition:width .3s ease}

/* FILE INFO */
.file-info{background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:1rem;margin-bottom:1rem}
.file-info.hidden{display:none}
.file-info-main{display:flex;justify-content:space-between;align-items:baseline;
    flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
.file-name{font-size:1rem;font-weight:600}
.file-version{color:var(--text-dim);font-size:.85rem}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:.5rem}
.count-card{background:var(--surface2);border-radius:8px;padding:.5rem;text-align:center}
.count-card b{display:block;font-size:1.1rem;color:var(--accent)}
.count-card span{font-size:.75rem;color:var(--text-dim)}

/* TABS */
.tabs{display:flex;gap:.25rem;overflow-x:auto;padding-bottom:.5rem;
    margin-bottom:1rem;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab{flex:0 0 auto;background:var(--surface);border:1px solid var(--border);
    color:var(--text-dim);padding:.5rem 1rem;border-radius:20px;
    cursor:pointer;font-size:.9rem;white-space:nowrap;transition:all .15s}
.tab:hover{background:var(--surface2)}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}

/* PANELS */
.panel{display:none;animation:fadeIn .2s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.panel h2{font-size:1.1rem;margin-bottom:.75rem}
.panel-header{display:flex;justify-content:space-between;align-items:center;
    gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}

/* CHUNK GRID */
.chunk-grid{display:flex;flex-wrap:wrap;gap:.4rem}
.chunk-item{display:flex;gap:.4rem;align-items:baseline;background:var(--surface);
    border:1px solid var(--border);padding:.35rem .6rem;border-radius:6px;font-size:.85rem}
.chunk-item b{color:var(--accent)}
.chunk-size{color:var(--text-dim);font-size:.8rem}

/* SPRITE GRID */
.sprite-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.75rem}
.sprite-card{background:var(--surface);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.sprite-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sprite-card img{display:block;width:100%;height:100px;object-fit:contain;
    background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface3) 0 50%) 50%/16px 16px;
    padding:4px}
.sprite-meta{display:flex;justify-content:space-between;padding:.35rem .5rem;
    font-size:.75rem;color:var(--text-dim)}

/* AUDIO LIST */
.audio-list{display:flex;flex-direction:column;gap:.5rem}
.audio-item{display:flex;align-items:center;gap:.75rem;background:var(--surface);
    border:1px solid var(--border);padding:.5rem .75rem;border-radius:8px;flex-wrap:wrap}
.audio-info{flex:1;min-width:120px}
.audio-info small{display:block;color:var(--text-dim);font-size:.8rem}
.audio-item audio{height:32px;max-width:280px;flex:1}

/* STRING LIST */
.search{background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:.5rem .75rem;border-radius:8px;font-size:.9rem;min-width:200px;flex:1;max-width:320px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.string-list{background:var(--surface);border:1px solid var(--border);
    border-radius:8px;max-height:500px;overflow-y:auto}
.string-row{padding:.4rem .75rem;border-bottom:1px solid var(--border);
    font-family:monospace;font-size:.85rem;word-break:break-all}
.string-row:last-child{border-bottom:none}
.string-row:hover{background:var(--surface2)}
.more-notice{padding:.75rem;text-align:center;color:var(--text-dim);
    font-size:.85rem;font-style:italic}

/* CODE LIST */
.code-list{display:flex;flex-direction:column;gap:.75rem}
.code-chunk{background:var(--surface);border:1px solid var(--border);
    border-radius:8px;overflow:hidden}
.code-header{background:var(--surface2);padding:.5rem .75rem;
    font-size:.85rem;color:var(--accent);border-bottom:1px solid var(--border)}
.code-chunk pre{padding:.75rem;font-family:monospace;font-size:.8rem;
    max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all}

/* LOG */
.log{background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:.75rem;font-family:monospace;font-size:.8rem;height:400px;overflow-y:auto}
.log-info{color:var(--text-dim)}
.log-ok{color:var(--ok)}
.log-warn{color:var(--warn)}
.log-err{color:var(--danger)}

/* BUTTON */
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-size:.9rem;
    white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface3)}

/* ACTION BAR / FAB */
.action-bar{position:fixed;bottom:0;left:0;right:0;padding:.75rem;
    background:var(--surface);border-top:1px solid var(--border);
    display:flex;gap:.5rem;z-index:50;box-shadow:0 -4px 12px rgba(0,0,0,.2)}
.fab{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;
    background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:.75rem;border-radius:12px;font-size:.9rem;cursor:pointer;
    font-weight:500;transition:all .15s}
.fab.primary{background:var(--accent);color:white;border-color:var(--accent)}
.fab.primary:hover{filter:brightness(1.1)}
.fab:hover{transform:translateY(-1px)}

.empty{padding:2rem;text-align:center;color:var(--text-dim);font-style:italic}

/* DESKTOP */
@media (min-width:768px){
    .app-main{padding:1.5rem;padding-bottom:1.5rem}
    .drop-zone{padding:3rem 2rem}
    .drop-icon{font-size:4rem}
    .drop-title{font-size:1.15rem}
    .sprite-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .sprite-card img{height:130px}
    .action-bar{position:static;background:transparent;border:none;
        box-shadow:none;padding:1rem 0;margin-top:1rem;max-width:420px}
    .fab{padding:.6rem 1.2rem}
    .tabs{gap:.5rem}
    .tab{padding:.6rem 1.2rem;font-size:.95rem}
}

/* MOBILE */
@media (max-width:767px){
    .file-info-main{flex-direction:column;align-items:flex-start}
    .panel-header{flex-direction:column;align-items:stretch}
    .search{max-width:none}
    .audio-item audio{width:100%;max-width:none}
    .fab-label{font-size:.8rem}
    .sprite-card img{height:80px}
}
</style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <h1>UTMT Web</h1>
        <span class="version">v2.0</span>
    </div>
    <button id="themeToggle" class="btn-icon" title="Đổi giao diện">🌓</button>
</header>

<main class="app-main">
    <section id="dropZone" class="drop-zone">
        <input type="file" id="fileInput" accept=".win,.droid">
        <div class="drop-content">
            <div class="drop-icon">📁</div>
            <div class="drop-title">Kéo thả <b>data.win</b> hoặc <b>game.droid</b></div>
            <div class="drop-hint">Hoặc bấm để chọn file</div>
        </div>
    </section>

    <div id="progress" class="progress">
        <div class="progress-info"><span id="progressText">Đang xử lý…</span></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <section id="fileInfo" class="file-info hidden">
        <div class="file-info-main">
            <div class="file-name" id="fileName"></div>
            <div class="file-version" id="fileVersion"></div>
        </div>
        <div id="counts" class="counts"></div>
    </section>

    <nav class="tabs" role="tablist">
        <button data-tab="overview" class="tab active">📊 Tổng quan</button>
        <button data-tab="sprites" class="tab">🖼️ Sprites</button>
        <button data-tab="audio" class="tab">🎵 Audio</button>
        <button data-tab="strings" class="tab">📝 Strings</button>
        <button data-tab="code" class="tab">💻 Code</button>
        <button data-tab="log" class="tab">📋 Log</button>
    </nav>

    <div class="panels">
        <section data-panel="overview" class="panel active">
            <h2>Chunks trong file</h2>
            <div id="chunkList" class="chunk-grid"></div>
        </section>

        <section data-panel="sprites" class="panel">
            <div class="panel-header">
                <h2>Sprites (PNG)</h2>
                <button id="btnZipSprites" class="btn">🗜 ZIP Sprites</button>
            </div>
            <div id="spriteGrid" class="sprite-grid"></div>
        </section>

        <section data-panel="audio" class="panel">
            <div class="panel-header">
                <h2>Audio</h2>
                <button id="btnZipAudio" class="btn">🗜 ZIP Audio</button>
            </div>
            <div id="audioList" class="audio-list"></div>
        </section>

        <section data-panel="strings" class="panel">
            <div class="panel-header">
                <h2>Strings</h2>
                <input type="search" id="search" class="search" placeholder="Tìm string…">
            </div>
            <div id="stringList" class="string-list"></div>
        </section>

        <section data-panel="code" class="panel">
            <h2>Code chunks</h2>
            <div id="codeList" class="code-list"></div>
        </section>

        <section data-panel="log" class="panel">
            <h2>Log</h2>
            <div id="log" class="log"></div>
        </section>
    </div>
</main>

<div class="action-bar">
    <button id="btnZipAll" class="fab primary">
        <span>🗜</span><span class="fab-label">ZIP tất cả</span>
    </button>
    <button id="btnExportJSON" class="fab">
        <span>💾</span><span class="fab-label">Metadata JSON</span>
    </button>
</div>

<script src="UTMTweb.js"></script>
</body>
</html>
